name: iOS CI/CD

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: "Upload to 
         (true/false)"
        required: false
        default: "false"

env:
  SCHEME: "love-unlocked"           # e.g. LoveUnlocked
  BUNDLE_ID: "com.chetankumar.loveunlocked"      # e.g. com.example.loveunlocked
  PROFILE_NAME: "<YourProfileName>" # Name shown on the provisioning profile

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build (simulator)
        run: |
          set -eo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            clean build

      # Uncomment if/when you add tests
      # - name: Test (simulator)
      #   run: |
      #     set -eo pipefail
      #     xcodebuild \
      #       -scheme "$SCHEME" \
      #       -destination "platform=iOS Simulator,name=iPhone 15" \
      #       test

  deploy:
    if: github.event.inputs.release == 'true'
    needs: build-and-test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Decode App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          echo "$ASC_API_KEY_BASE64" | base64 --decode > AuthKey_$ASC_API_KEY_ID.p8
          echo "ASC_KEY_PATH=$PWD/AuthKey_$ASC_API_KEY_ID.p8" >> $GITHUB_ENV

      - name: Import signing certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import dist.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROFILE_APPSTORE_BASE64: ${{ secrets.IOS_PROFILE_APPSTORE_BASE64 }}
        run: |
          echo "$IOS_PROFILE_APPSTORE_BASE64" | base64 --decode > appstore.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i appstore.mobileprovision))
          cp appstore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Archive (Release)
        run: |
          set -eo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -destination "generic/platform=iOS" \
            clean archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          {
            "method": "app-store",
            "provisioningProfiles": { "<YourBundleID>": "<YourProfileName>" },
            "signingStyle": "manual",
            "uploadSymbols": true,
            "compileBitcode": false
          }
          EOF
          set -eo pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
        run: |
          xcrun altool --upload-app \
            -t ios \
            -f $RUNNER_TEMP/export/*.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --apiKeyPath "$ASC_KEY_PATH"

